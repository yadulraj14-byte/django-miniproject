
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#eef3f8;
        }

        .card{
            margin-top:40px;
            border:none;
            border-radius:18px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        .card-header{
            background:linear-gradient(to right,#0d6efd,#6610f2);
            color:white;
            padding:20px 30px;
        }

        .page-title{
            margin:0;
            font-weight:bold;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .badge-count{
            font-size:16px;
            padding:10px 18px;
        }

        .table th{
            background:#0d6efd;
            color:white;
            text-align:center;
            vertical-align:middle;
        }

        .table td{
            text-align:center;
            vertical-align:middle;
        }

        .table tbody tr:hover{
            background:#f8f9fa;
        }

        .action-btn{
            margin:2px;
        }

    </style>

</head>

<body>

<div class="container">

<div class="card">

<div class="card-header d-flex justify-content-between align-items-center">

<a href="{% url 'admin' %}" class="btn btn-light">

<i class="bi bi-arrow-left"></i>

Back

</a>

<h3 class="page-title">

<i class="bi bi-person-fill"></i>

Candidate Management

</h3>

<div></div>

</div>

<div class="card-body">

<div class="top-bar">

<span class="badge bg-primary badge-count">

Total Candidates :
{{ candidates|length }}

</span>

<a href="{% url 'add_candidate' %}"

class="btn btn-success">

<i class="bi bi-person-plus-fill"></i>

Add Candidate

</a>

</div>

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>ID</th>

<th>Username</th>

<th>Email</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

{% for i in candidates %}

<tr>

<td>{{ forloop.counter }}</td>

<td>{{ i.username }}</td>

<td>{{ i.email }}</td>

<td>

<a href="{% url 'edit_candidate' i.id %}"

class="btn btn-warning btn-sm action-btn">

<i class="bi bi-pencil-square"></i>

Edit

</a>

<a href="{% url 'delete_candidate' i.id %}"

class="btn btn-danger btn-sm action-btn"

onclick="return confirm('Delete this candidate?')">

<i class="bi bi-trash"></i>

Delete

</a>

</td>

</tr>

{% empty %}

<tr>

<td colspan="4">

<div class="alert alert-warning m-3">

<i class="bi bi-exclamation-circle"></i>

No Candidates Found

</div>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</body>
</html>
