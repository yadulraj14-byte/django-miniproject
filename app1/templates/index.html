{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;

            background-image:url("https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1600&q=80");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .overlay{
            position:absolute;
            width:100%;
            height:100%;
            background:rgba(0,0,0,.55);
        }

        .hero{
            position:relative;
            text-align:center;
            color:white;
            z-index:2;
            max-width:700px;
        }

        .hero h1{
            font-size:60px;
            font-weight:bold;
        }

        .hero p{
            font-size:20px;
            margin:20px 0 35px;
            color:#eaeaea;
        }

        .btn-custom{
            padding:14px 35px;
            font-size:18px;
            border-radius:50px;
            margin:10px;
            transition:.3s;
        }

        .btn-custom:hover{
            transform:translateY(-4px);
        }

    </style>

</head>
<body>

<div class="overlay"></div>

<div class="hero">

    <h1>Job Portal</h1>

    <p>
        Find your dream job or hire the perfect candidate.
        Start your career journey today.
    </p>

    <a href="{% url 'register' %}" class="btn btn-success btn-custom">
        Register
    </a>

    <a href="{% url 'login_view' %}" class="btn btn-primary btn-custom">
        Login
    </a>

</div>

</body>
</html>
