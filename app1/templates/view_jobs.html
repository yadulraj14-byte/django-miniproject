
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Jobs</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:linear-gradient(135deg,#74ebd5,#ACB6E5);
            min-height:100vh;
        }

        .main-card{
            margin-top:50px;
            border:none;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        .card-header{
            background:linear-gradient(to right,#0d6efd,#6610f2);
            color:white;
            padding:20px;
            position:relative;
        }

        .card-header h2{
            text-align:center;
            margin:0;
            font-weight:bold;
        }

        .back-btn{
            position:absolute;
            left:20px;
            top:50%;
            transform:translateY(-50%);
        }

        .table th{
            background:#0d6efd;
            color:white;
            text-align:center;
        }

        .table td{
            text-align:center;
            vertical-align:middle;
        }

        .table tbody tr:hover{
            background:#f8f9fa;
        }

        .description{
            max-width:350px;
            text-align:left;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card main-card">

        <div class="card-header">

            <a href="{% url 'admin' %}" class="btn btn-light back-btn">

                <i class="bi bi-arrow-left"></i> Back

            </a>

            <h2>

                <i class="bi bi-briefcase-fill"></i>

                Available Jobs

            </h2>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Position</th>

                        <th>Company</th>

                        <th>Description</th>

                    </tr>

                </thead>

                <tbody>

                    {% for i in jobs %}

                    <tr>

                        <td>{{ forloop.counter }}</td>

                        <td>{{ i.position }}</td>

                        <td>{{ i.company_name }}</td>

                        <td class="description">{{ i.description }}</td>

                    </tr>

                    {% empty %}

                    <tr>

                        <td colspan="4">

                            <h5 class="text-muted">

                                No Jobs Available

                            </h5>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
