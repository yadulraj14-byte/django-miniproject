<!DOCTYPE html>
<html>
<head>
    <title>{{ job.position }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2>{{ job.position }}</h2>

            <h5 class="text-muted">{{ job.company_name }}</h5>

            <hr>

            <h4>Description</h4>
            <p>{{ job.description }}</p>

            <h4>Details</h4>
            <p>{{ job.details }}</p>

            <a href="{% url 'candidate' %}" class="btn btn-secondary">
                Back
            </a>

            <a href="{% url 'apply_job' job.id %}" class="btn btn-primary">
                Apply Now
            </a>

        </div>

    </div>

</div>

</body>
</html>
