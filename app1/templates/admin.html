<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-5">

Admin Dashboard

</h2>

<div class="row">

<div class="col-md-3">

<div class="card text-center">

<div class="card-body">

<h1>{{ recruiters }}</h1>

<h5>Total Recruiters</h5>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-center">

<div class="card-body">

<h1>{{ candidates }}</h1>

<h5>Total Candidates</h5>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-center">

<div class="card-body">

<h1>{{ jobs }}</h1>

<h5>Total Jobs</h5>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-center">

<div class="card-body">

<h1>{{ applications }}</h1>

<h5>Total Applications</h5>

</div>

</div>

</div>

</div>

<hr>

<div class="row mt-4">

<div class="col-md-6">

<a href="{% url 'view_recruiters' %}"

class="btn btn-primary w-100">

Manage Recruiters

</a>

</div>

<div class="col-md-6">

<a href="{% url 'view_candidates' %}"

class="btn btn-success w-100">

Manage Candidates

</a>

</div>

</div>

<div class="row mt-3">

<div class="col-md-6">

<a href="{% url 'view_jobs' %}"

class="btn btn-warning w-100">

View Jobs

</a>

</div>

<div class="col-md-6">

<a href="{% url 'view_all_applications' %}"

class="btn btn-danger w-100">

View Applications

</a>

</div>

</div>

</div>

</body>

</html>
