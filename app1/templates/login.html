<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background-image:url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1500&q=80');
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }

        .overlay{
            position:absolute;
            width:100%;
            height:100%;
            background:rgba(0,0,0,.35);
        }

        .login-card{
            position:relative;
            width:400px;
            padding:35px;
            border-radius:20px;

            background:rgba(255,255,255,.15);
            backdrop-filter:blur(12px);
            box-shadow:0 10px 30px rgba(0,0,0,.25);
            z-index:1;
        }

        h2{
            text-align:center;
            color:#fff;
            margin-bottom:25px;
            font-weight:bold;
        }

        label{
            color:white;
            margin-bottom:5px;
            font-weight:500;
        }

        input{
            width:100%;
            padding:12px;
            border-radius:10px;
            border:none;
            margin-bottom:15px;
        }

        .btn-login{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#0d6efd;
            color:white;
            font-size:17px;
            font-weight:bold;
            transition:.3s;
        }

        .btn-login:hover{
            background:#0b5ed7;
        }

        .register{
            text-align:center;
            margin-top:18px;
        }

        .register a{
            color:#fff;
            text-decoration:none;
            font-weight:bold;
        }

        .register a:hover{
            text-decoration:underline;
        }

        .msg{
            color:#ffb3b3;
            text-align:center;
            margin-bottom:15px;
        }

        /* Bootstrap styling for Django form fields */
        input[type=text],
        input[type=password],
        input[type=email]{
            width:100%;
            padding:10px;
            border-radius:10px;
            border:1px solid #ddd;
        }

    </style>
</head>

<body>

<div class="overlay"></div>

<div class="login-card">

    <h2>Welcome Back</h2>

    {% if msg %}
        <div class="msg">{{ msg }}</div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn-login">
            Login
        </button>

    </form>

    <div class="register">
        <a href="{% url 'register' %}">
            Don't have an account? Register
        </a>
    </div>

</div>

</body>
</html>
