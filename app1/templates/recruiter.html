
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:linear-gradient(135deg,#74ebd5,#ACB6E5);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .dashboard-card{
            border:none;
            border-radius:20px;
            overflow:hidden;
            width:100%;
            max-width:700px;
        }

        .card-header{
            background:linear-gradient(to right,#0d6efd,#6610f2);
            padding:20px 25px;
            position:relative;
        }

        .card-header h2{
            margin:0;
            text-align:center;
            color:white;
            font-weight:bold;
        }

        .back-btn{
            position:absolute;
            left:20px;
            top:50%;
            transform:translateY(-50%);
        }

        .card-body{
            background:white;
            padding:45px;
            text-align:center;
        }

        .icon{
            font-size:65px;
            color:#0d6efd;
        }

        h3{
            margin-top:20px;
            font-weight:bold;
        }

        p{
            color:#6c757d;
        }

        .btn-custom{

            width:260px;
            font-size:18px;
            padding:14px;
            border-radius:12px;
            transition:.3s;

        }

        .btn-custom:hover{

            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(0,0,0,.2);

        }

    </style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg dashboard-card">

<div class="card-header">

<a href="{% url 'index' %}" class="btn btn-light back-btn">

<i class="bi bi-arrow-left"></i> Back

</a>

<h2>

<i class="bi bi-speedometer2"></i>

Recruiter Dashboard

</h2>

</div>

<div class="card-body">

<i class="bi bi-briefcase-fill icon"></i>

<h3>Job Management</h3>

<p class="mb-4">

Manage job vacancies and review candidate applications.

</p>

<div class="d-grid gap-3 justify-content-center">

<a href="{% url 'add' %}"

class="btn btn-primary btn-lg btn-custom">

<i class="bi bi-plus-circle"></i>

Add New Job

</a>

<a href="{% url 'view_applications' %}"

class="btn btn-success btn-lg btn-custom">

<i class="bi bi-people-fill"></i>

View Applications

</a>

</div>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
