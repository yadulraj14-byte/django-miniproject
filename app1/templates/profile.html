
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:linear-gradient(135deg,#74ebd5,#ACB6E5);
            min-height:100vh;
        }

        .profile-card{
            margin-top:50px;
            border:none;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        .card-header{
            background:linear-gradient(to right,#0d6efd,#6610f2);
            color:white;
            padding:20px;
            position:relative;
        }

        .back-btn{
            position:absolute;
            left:20px;
            top:50%;
            transform:translateY(-50%);
        }

        .card-header h2{
            text-align:center;
            margin:0;
            font-weight:bold;
        }

        .card-body{
            background:white;
            padding:40px;
        }

        .profile-img{
            width:170px;
            height:170px;
            border-radius:50%;
            object-fit:cover;
            border:5px solid #0d6efd;
        }

        .info-box{
            background:#f8f9fa;
            border-radius:12px;
            padding:15px;
            margin-bottom:15px;
        }

        .info-title{
            color:#0d6efd;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card profile-card">

        <div class="card-header">

            <a href="{% url 'candidate' %}" class="btn btn-light back-btn">
                <i class="bi bi-arrow-left"></i> Back
            </a>

            <h2>
                <i class="bi bi-person-circle"></i>
                My Profile
            </h2>

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-4 text-center">

                    {% if profile.profile_picture %}
                        <img src="{{ profile.profile_picture.url }}" class="profile-img">
                    {% else %}
                        <img src="https://via.placeholder.com/170" class="profile-img">
                    {% endif %}

                    <h3 class="mt-3">
                        {{ request.user.username }}
                    </h3>

                    <p class="text-muted">
                        {{ request.user.email }}
                    </p>

                </div>

                <div class="col-md-8">

                    <div class="info-box">
                        <div class="info-title">
                            <i class="bi bi-telephone-fill"></i>
                            Phone Number
                        </div>
                        {{ profile.phone }}
                    </div>

                    <div class="info-box">
                        <div class="info-title">
                            <i class="bi bi-mortarboard-fill"></i>
                            Qualification
                        </div>
                        {{ profile.qualification }}
                    </div>

                    <div class="info-box">
                        <div class="info-title">
                            <i class="bi bi-tools"></i>
                            Skills
                        </div>
                        {{ profile.skills }}
                    </div>

                    <div class="info-box">
                        <div class="info-title">
                            <i class="bi bi-geo-alt-fill"></i>
                            Address
                        </div>
                        {{ profile.address }}
                    </div>

                    <div class="text-end mt-4">

                        <a href="{% url 'edit_profile' %}"
                           class="btn btn-primary btn-lg">

                            <i class="bi bi-pencil-square"></i>

                            Edit Profile

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
