
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Job</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:linear-gradient(135deg,#74ebd5,#ACB6E5);
            min-height:100vh;
        }

        .main-card{
            margin-top:40px;
            margin-bottom:40px;
            border:none;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        .card-header{
            background:linear-gradient(to right,#0d6efd,#6610f2);
            color:white;
            padding:20px;
            position:relative;
        }

        .card-header h2{
            text-align:center;
            margin:0;
            font-weight:bold;
        }

        .back-btn{
            position:absolute;
            left:20px;
            top:50%;
            transform:translateY(-50%);
        }

        .card-body{
            padding:35px;
        }

        .job-box{
            background:#f8f9fa;
            border-left:5px solid #0d6efd;
            padding:15px;
            margin-bottom:30px;
            border-radius:10px;
        }

        label{
            font-weight:600;
            margin-top:10px;
        }

        .btn-submit{
            width:100%;
            padding:12px;
            font-size:18px;
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="container">

<div class="card main-card">

<div class="card-header">

<a href="{% url 'candidate' %}" class="btn btn-light back-btn">

<i class="bi bi-arrow-left"></i> Back

</a>

<h2>

<i class="bi bi-send-check-fill"></i>

Apply for Job

</h2>

</div>

<div class="card-body">

<div class="job-box">

<h4 class="text-primary">

{{ job.position }}

</h4>

<p class="mb-0">

<strong>Company:</strong> {{ job.company_name }}

</p>

</div>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

{{ form.as_p }}

<br>

<button type="submit" class="btn btn-primary btn-submit">

<i class="bi bi-check-circle-fill"></i>

Submit Application

</button>

</form>

</div>

</div>

</div>

</body>
</html>
