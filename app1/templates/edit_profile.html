
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:linear-gradient(135deg,#74ebd5,#ACB6E5);
            min-height:100vh;
        }

        .profile-card{
            max-width:700px;
            margin:50px auto;
            border:none;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        .card-header{
            background:linear-gradient(to right,#0d6efd,#6610f2);
            color:white;
            padding:20px;
            position:relative;
        }

        .card-header h2{
            margin:0;
            text-align:center;
            font-weight:bold;
        }

        .back-btn{
            position:absolute;
            left:20px;
            top:50%;
            transform:translateY(-50%);
        }

        .card-body{
            background:white;
            padding:35px;
        }

        label{
            font-weight:bold;
            margin-bottom:6px;
        }

        .form-control{
            border-radius:10px;
            padding:10px;
            margin-bottom:18px;
        }

        textarea.form-control{
            resize:none;
        }

        .btn-save{
            width:100%;
            font-size:18px;
            border-radius:10px;
            padding:12px;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="card profile-card">

        <div class="card-header">

            <a href="{% url 'profile' %}" class="btn btn-light back-btn">
                <i class="bi bi-arrow-left"></i> Back
            </a>

            <h2>
                <i class="bi bi-pencil-square"></i>
                Edit Profile
            </h2>

        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="mb-3">
                    <label>Phone Number</label>
                    {{ form.phone }}
                </div>

                <div class="mb-3">
                    <label>Qualification</label>
                    {{ form.qualification }}
                </div>

                <div class="mb-3">
                    <label>Skills</label>
                    {{ form.skills }}
                </div>

                <div class="mb-3">
                    <label>Address</label>
                    {{ form.address }}
                </div>

                <div class="mb-4">
                    <label>Profile Picture</label>
                    {{ form.profile_picture }}
                </div>

                <button type="submit" class="btn btn-primary btn-save">
                    <i class="bi bi-check-circle-fill"></i>
                    Update Profile
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
