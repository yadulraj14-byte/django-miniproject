<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Jobs</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:linear-gradient(135deg,#74ebd5,#ACB6E5);
            min-height:100vh;
        }

        .main-card{
            margin-top:50px;
            border:none;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        .card-header{
            background:linear-gradient(to right,#0d6efd,#6610f2);
            color:white;
            padding:20px;
            position:relative;
        }

        .card-header h2{
            text-align:center;
            margin:0;
            font-weight:bold;
        }

        .back-btn{
            position:absolute;
            left:20px;
            top:50%;
            transform:translateY(-50%);
        }

        .table th{
            background:#0d6efd;
            color:white;
            text-align:center;
            vertical-align:middle;
        }

        .table td{
            text-align:center;
            vertical-align:middle;
        }

        .table tbody tr:hover{
            background:#eef4ff;
            transition:.3s;
        }

        .btn-sm{
            border-radius:8px;
            padding:6px 14px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card main-card">

        <div class="card-header">

            <a href="{% url 'candidate' %}" class="btn btn-light back-btn">

                <i class="bi bi-arrow-left"></i> Back

            </a>

            <h2>

                <i class="bi bi-bookmark-heart-fill"></i>

                Saved Jobs

            </h2>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Job Position</th>

                        <th>Company</th>

                        <th>Saved Date</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody>

                    {% for i in jobs %}

                    <tr>

                        <td>{{ forloop.counter }}</td>

                        <td>{{ i.job.position }}</td>

                        <td>{{ i.job.company_name }}</td>

                        <td>{{ i.saved_date }}</td>

                        <td>

                            <a href="{% url 'job_details' i.job.id %}"
                               class="btn btn-primary btn-sm">

                                <i class="bi bi-eye-fill"></i>

                                View

                            </a>

                            <a href="{% url 'remove_saved_job' i.id %}"
                               class="btn btn-danger btn-sm">

                                <i class="bi bi-trash-fill"></i>

                                Remove

                            </a>

                        </td>

                    </tr>

                    {% empty %}

                    <tr>

                        <td colspan="5">

                            <h5 class="text-center text-muted">

                                <i class="bi bi-bookmark-x-fill"></i>

                                No Saved Jobs Found

                            </h5>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
