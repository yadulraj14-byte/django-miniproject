<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background-image:url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1500&q=80');
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }

        .overlay{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,.35);
        }

        .register-card{
            position:relative;
            width:450px;
            padding:35px;
            border-radius:20px;

            background:rgba(255,255,255,.15);
            backdrop-filter:blur(12px);
            box-shadow:0 10px 30px rgba(0,0,0,.25);
            z-index:1;
        }

        h2{
            color:white;
            text-align:center;
            margin-bottom:25px;
            font-weight:bold;
        }

        label{
            color:white;
            font-weight:500;
        }

        input{
            width:100%;
            padding:11px;
            border-radius:10px;
            border:none;
            margin-bottom:15px;
        }

        .btn-register{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#198754;
            color:white;
            font-size:17px;
            font-weight:bold;
            transition:.3s;
        }

        .btn-register:hover{
            background:#157347;
        }

        .login-link{
            text-align:center;
            margin-top:20px;
        }

        .login-link a{
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        .msg{
            color:#ffb3b3;
            text-align:center;
            margin-bottom:15px;
        }

        input[type=text],
        input[type=password],
        input[type=email]{
            width:100%;
            border-radius:10px;
            border:1px solid #ddd;
            padding:10px;
        }

    </style>

</head>

<body>

<div class="overlay"></div>

<div class="register-card">

    <h2>Create Account</h2>

    {% if msg %}
        <div class="msg">{{ msg }}</div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn-register">
            Register
        </button>

    </form>

    <div class="login-link">
        <a href="{% url 'login_view' %}">
            Already have an account? Login
        </a>
    </div>

</div>

</body>
</html>
